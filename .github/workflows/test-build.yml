name: Docker build (test only)

on:
  push:
    branches-ignore:
      - "main"
    tags-ignore:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build image without pushing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: expanse:test
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-check the image
        run: docker image inspect expanse:test --format '{{.Id}} {{.Architecture}}'

      - name: Scan image (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: expanse:test
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
