name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  quality:
    name: Lint, typecheck, tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: License headers
        run: pnpm license:check

      # Includes the integration test that renders every data/library template
      # and validates it with the real `docker compose config` (Docker is
      # available on GitHub-hosted runners).
      - name: Unit and integration tests
        run: pnpm test

      - name: Security audit
        run: pnpm audit --audit-level=high
