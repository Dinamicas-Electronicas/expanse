name: Image security scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  trivy:
    name: Scan published image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/dinamicas-electronicas/expanse:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
