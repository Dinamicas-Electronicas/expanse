name: expanse

services:
  app:
    build: .
    image: expanse:local
    ports:
      - "4000:3000"
    environment:
      - CORE_ONLY=true
      - DISABLE_TELEMETRY=true
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - BREVO_DISABLED=${BREVO_DISABLED:-true}
      - URL=${APP_URL:-http://localhost:4000}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set; run pnpm generate-secrets}
      - MONGODB_URI=mongodb://${DB_USER:?DB_USER must be set}:${DB_PASS:?DB_PASS must be set}@db:27017/expanse?authSource=admin
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    # We need root or being in the docker group to access the socket
    user: root
    networks:
      - expanse-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: the library is baked into the image and rebuilt by
      # `pnpm sync-icons`, the container should never mutate it.
      - ./data/library:/app/data/library:ro
      # Generated PNG exports must survive container restarts.
      - expanse_exports:/app/public/exports

  db:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:?DB_USER must be set; run pnpm generate-secrets}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:?DB_PASS must be set; run pnpm generate-secrets}
    volumes:
      - expanse_db_data:/data/db
    networks:
      - expanse-net
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  expanse-net:
    driver: bridge

volumes:
  expanse_db_data:
  expanse_exports:
