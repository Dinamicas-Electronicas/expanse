packages:
  - '.'

# pnpm >=11 reads these settings from pnpm-workspace.yaml (the old
# "pnpm" field in package.json is ignored and silently skipped).
# `allowBuilds` replaces `onlyBuiltDependencies` in pnpm 11+.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  'core-js': true
  'esbuild': true
  'expanse-docker-lib': true
  'sharp': true
  'unrs-resolver': true

patchedDependencies:
  expanse-docker-lib: patches/expanse-docker-lib.patch

# Security overrides. Remove an entry once the upstream parent ships the
# patched version; `pnpm audit` must stay clean (see `pnpm audit`).
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=4.0.0': 5.0.12
  'dompurify': 3.4.17
  'fflate@<0.4.9': 0.4.9
  'follow-redirects@<1.16.2': 1.16.2
  'js-yaml@<4.3.2': 4.3.2
  'minimatch@>=7.0.0': 11.0.1
  'nanoid': 3.3.18
  'postcss': 8.5.33
  'postcss-selector-parser@<6.1.5': 6.1.5
  'sharp': 0.35.5
  'source-map-js@<1.2.2': 1.2.2
  'undici@>=7.0.0': 7.30.1
  'vite@>=8.0.0': 8.3.8

# pnpm refuses to install versions newer than the release-age policy unless
# they are explicitly excluded. These were added by pnpm when upgrading.
minimumReleaseAgeExclude:
  - '@eloqnt/extractor@0.1.0'
  - '@eloqnt/messages@0.1.0'
  - '@posthog/browser-common@0.12.1'
  - '@posthog/core@1.69.2'
  - '@posthog/types@1.427.0'
  - next-intl@4.15.3
  - posthog-js@1.453.0
